<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="shortcut icon" href="%PUBLIC_PATH%favicon.png" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width" />
        <meta name="theme-color" content="#000000" />
        <title>ExpoFP Floor Plan</title>
        <script>
            if (window.navigator.userAgent.indexOf("Trident/") !== -1) {
                alert("Your are using old unsupported Internet Explorer browser.\nPlease upgrade to view this page properly.");
            }
            window.addEventListener("error", function(e) {
                console.warn("Error message", e.message);
            });
        </script>
        <style>
            html {
                background: #ebebeb;
            }
            body {
                margin: 0;
            }
            .lds-grid {
                top: 42vh;
                margin: 0 auto;
                display: block;
                position: relative;
                width: 64px;
                height: 64px;
            }

            .lds-grid div {
                position: absolute;
                width: 13px;
                height: 13px;
                background: #aaa;
                border-radius: 50%;
                /* border: solid 1px #fff; */
                animation: lds-grid 1.2s linear infinite;
            }

            .lds-grid div:nth-child(1) {
                top: 6px;
                left: 6px;
                animation-delay: 0s;
            }

            .lds-grid div:nth-child(2) {
                top: 6px;
                left: 26px;
                animation-delay: -0.4s;
            }

            .lds-grid div:nth-child(3) {
                top: 6px;
                left: 45px;
                animation-delay: -0.8s;
            }

            .lds-grid div:nth-child(4) {
                top: 26px;
                left: 6px;
                animation-delay: -0.4s;
            }

            .lds-grid div:nth-child(5) {
                top: 26px;
                left: 26px;
                animation-delay: -0.8s;
            }

            .lds-grid div:nth-child(6) {
                top: 26px;
                left: 45px;
                animation-delay: -1.2s;
            }

            .lds-grid div:nth-child(7) {
                top: 45px;
                left: 6px;
                animation-delay: -0.8s;
            }

            .lds-grid div:nth-child(8) {
                top: 45px;
                left: 26px;
                animation-delay: -1.2s;
            }

            .lds-grid div:nth-child(9) {
                top: 45px;
                left: 45px;
                animation-delay: -1.6s;
            }

            @keyframes lds-grid {
                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: 0.5;
                }
            }
        </style>
        <link rel="preload" href="https://%EXPO_NAME%.expofp.com/data/data.js" as="script" crossorigin="anonymous" />
        <link rel="preload" href="https://%EXPO_NAME%.expofp.com/data/fp.svg.js" as="script" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%floorplan.js" as="script" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%vendors~floorplan.js" as="script" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%vendor/fa/css/fontawesome-all.min.css" as="style" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%vendor/sanitize-css/sanitize.css" as="style" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%fonts/fonts.css" as="style" crossorigin="anonymous" />
        <link
            rel="preload"
            href="%PUBLIC_PATH%vendor/perfect-scrollbar/css/perfect-scrollbar.css"
            as="style"
            crossorigin="anonymous"
        />
        <link rel="preload" href="%PUBLIC_PATH%vendor/fa/webfonts/fa-regular-400.woff2" as="font" crossorigin="anonymous" />
        <link rel="preload" href="%PUBLIC_PATH%vendor/fa/webfonts/fa-solid-900.woff2" as="font" crossorigin="anonymous" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div class="expofp-floorplan" data-event="%EXPO_NAME%"></div>
        <div class="expofp-floorplan-loader">
            <div class="lds-grid">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <script src="%PUBLIC_PATH%expofp.js" crossorigin="anonymous"></script>
    </body>
</html>
