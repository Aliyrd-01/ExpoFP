<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width"
    />
  </head>
  <body>
    <div id="floorplan">Loading...</div>
    <script
      src="https://wayfinding.expofp.com/packages/features/wayfinding/expofp.js"
      crossorigin="anonymous"
    ></script>
    <script>
      document.onload = () => {
        var fp = new ExpoFP.FloorPlan({
          element: document.querySelector("#floorplan"),
          eventId: "rodion2",
          noOverlay: true,
          onBoothClick: (e) => {
            window.Print.postMessage(`Booth clicked: ${e.target.name}`);
          }
        });
        
        setTimeout(()=>{
          fp.selectBooth("24");
        },2000);
        
      };
    </script>
  </body>
</html>
