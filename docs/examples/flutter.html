<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width"
    />
  </head>
  <body>
    <div id="floorplan">Loading...</div>
    <script
      src="https://demo.expofp.com/packages/master/expofp.js"
      crossorigin="anonymous"
    ></script>
    <script>
      document.onload = () => {
        new ExpoFP.FloorPlan({
          element: document.querySelector("#floorplan"),
          eventId: "rodion2",
          noOverlay: true,
          onBoothClick: (e) => {
            window.Print.postMessagealert(`Booth clicked: ${e.target.name}`);
          }
        });
      };
    </script>
  </body>
</html>
