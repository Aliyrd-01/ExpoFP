<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width" />
    </head>
    <body>
        <div id="floorplan">Loading...</div>
        <script src="https://wayfinding.expofp.com/packages/features/wayfinding/expofp.js" crossorigin="anonymous"></script>
        <script>
            let interval = null;
            let counter = 0;

            let resetAnimation = () => {
                fp.selectCurrentPosition(null);
                if (interval) interval = clearInterval(interval);
                counter = 0;
            };

            let fp = new ExpoFP.FloorPlan({
                element: document.querySelector("#floorplan"),
                eventId: "wayfinding",
                noOverlay: false,
                onBoothClick: (e) => console.info(`Booth clicked: ${e.target.name}`),
                onDirection: (e) => {
                    resetAnimation();

                    let points = e.points;

                    if (!points) return;

                    let step = points.length - 1;

                    interval = setInterval(() => {
                        if (step == -1) {
                            step = points.length - 1;
                            counter++;
                            if (counter == 2) resetAnimation();
                        } else {
                            fp.selectCurrentPosition({ x: points[step].x, y: points[step].y });
                            step--;
                        }
                    }, 50);
                },
            });
        </script>
    </body>
</html>
