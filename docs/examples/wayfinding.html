<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width" />
    </head>
    <body>
        <div id="floorplan">Loading...</div>
        <script src="https://wayfinding.expofp.com/packages/features/wayfinding/expofp.js" crossorigin="anonymous"></script>
        <script>
            let fp = new ExpoFP.FloorPlan({
                element: document.querySelector("#floorplan"),
                eventId: "wayfinding",
                noOverlay: false,
                onBoothClick: (e) => console.info(`Booth clicked: ${e.target.name}`),
                onFpConfigured: () => fp.selectRoute("1512", "1205"),
                onDirection: (e) => {
                    if (!e.points || !e.points.length) fp.selectCurrentPosition(null);
                    else {
                        let middlePoint = e.points[Math.floor(e.points.length / 2)];
                        fp.selectCurrentPosition(middlePoint);
                    }
                },
            });
        </script>
    </body>
</html>
