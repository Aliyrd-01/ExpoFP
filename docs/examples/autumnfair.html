<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width" />
    </head>
    <body>
        <div id="floorplan">Loading...</div>
        <script src="https://wayfinding.expofp.com/packages/features/wayfinding/expofp.js" crossorigin="anonymous"></script>
        <script>
            window.floorplan = new ExpoFP.FloorPlan({
                element: document.querySelector("#floorplan"),
                eventId: "wayfinding",
                noOverlay: true,
                onBoothClick: e => {
                    window.flutter_inappwebview?.callHandler('onBoothClick', e.target.name);
		    window.messageHandler?.postMessage(e.target.name);
                }
            });
			
			function selectRoute(from, to, exceptUnAccessible){
				window.floorplan?.selectRoute(from, to, exceptUnAccessible);
			}
			
			function selectBooth(name){
				window.floorplan?.selectBooth(name);
			}		
        </script>
    </body>
</html>
